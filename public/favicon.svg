<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />  <stop offset="40%" stop-color="#F59E0B" /> <stop offset="100%" stop-color="#B45309" /> </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="256" fill="#0A0F1C" />

  <text 
    x="50%" 
    y="54%" 
    dominant-baseline="middle" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, 'Montserrat', 'Helvetica Neue', sans-serif" 
    font-weight="900" 
    font-size="240" 
    letter-spacing="-12" 
    fill="url(#goldGradient)" 
    filter="url(#dropShadow)"
  >sa</text>
</svg>
